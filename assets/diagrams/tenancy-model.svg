<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="t d">
  <title id="t">SwiftCart tenancy model</title>
  <desc id="d">Customers see one open, nationwide catalogue. Each store resolves to the delivery company that fulfils it, and those companies are strictly partitioned from one another on a shared Postgres database. An admin console reads either one company's data or every company's.</desc>

  <defs>
    <style>
      .lbl  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h    { font-weight: 700; font-size: 16px; fill: #2A2521; }
      .s    { font-weight: 400; font-size: 13px; fill: #6B6259; }
      .band { font-weight: 700; font-size: 11px; letter-spacing: 1.4px; }
      .edge { font-weight: 500; font-size: 12px; fill: #6B6259; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8AFA4"/>
    </marker>
  </defs>

  <rect width="900" height="660" rx="14" fill="#FFFDF8"/>

  <!-- Customer app -->
  <rect x="310" y="26" width="280" height="66" rx="14" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5"/>
  <text class="lbl h" x="450" y="55" text-anchor="middle">Customer app</text>
  <text class="lbl s" x="450" y="76" text-anchor="middle">one nationwide storefront</text>

  <line x1="450" y1="92" x2="450" y2="146" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="lbl edge" x="466" y="118">sees every store, whoever delivers it</text>

  <!-- OPEN band -->
  <rect x="40" y="152" width="820" height="124" rx="16" fill="#F0FAF3" stroke="#0E5A37" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="lbl band" x="62" y="178" fill="#0E5A37">OPEN — ONE CONSUMER BRAND</text>
  <rect x="270" y="192" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#CBE5D5" stroke-width="1.5"/>
  <text class="lbl h" x="450" y="220" text-anchor="middle">Catalogue</text>
  <text class="lbl s" x="450" y="241" text-anchor="middle">deliberately not tenant-scoped · public fields only</text>

  <line x1="450" y1="276" x2="450" y2="310" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Resolver -->
  <rect x="305" y="316" width="290" height="46" rx="23" fill="#FFF6E4" stroke="#E8B33D" stroke-width="1.5"/>
  <text class="lbl h" x="450" y="345" text-anchor="middle" font-size="14">Which company fulfils this store?</text>

  <!-- split -->
  <path d="M450 362 V 388 H 230 V 416" fill="none" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M450 362 V 388 H 670 V 416" fill="none" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- PARTITIONED band -->
  <rect x="40" y="422" width="820" height="122" rx="16" fill="#FDF2F0" stroke="#E8391D" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="lbl band" x="62" y="448" fill="#C42E14">PARTITIONED — STRICT PER-COMPANY ISOLATION</text>

  <rect x="80" y="460" width="300" height="66" rx="12" fill="#FFFFFF" stroke="#F3CFC8" stroke-width="1.5"/>
  <text class="lbl h" x="230" y="487" text-anchor="middle">Company A</text>
  <text class="lbl s" x="230" y="508" text-anchor="middle">own riders · own rates · own account</text>

  <rect x="520" y="460" width="300" height="66" rx="12" fill="#FFFFFF" stroke="#F3CFC8" stroke-width="1.5"/>
  <text class="lbl h" x="670" y="487" text-anchor="middle">Company B</text>
  <text class="lbl s" x="670" y="508" text-anchor="middle">own riders · own rates · own account</text>

  <path d="M230 544 V 566 H 380" fill="none" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M670 544 V 566 H 520" fill="none" stroke="#B8AFA4" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Database -->
  <rect x="250" y="572" width="400" height="62" rx="12" fill="#2A2521"/>
  <text class="lbl" x="450" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Shared Postgres</text>
  <text class="lbl" x="450" y="616" text-anchor="middle" font-size="12" fill="#C9C1B8">69 tables · RLS on every one · 29 carry company_id · 192 policies</text>

  <!-- Admin -->
  <line x1="650" y1="603" x2="712" y2="603" stroke="#B8AFA4" stroke-width="1.5"/>
  <rect x="712" y="566" width="160" height="74" rx="12" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5"/>
  <text class="lbl" x="792" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#2A2521">Admin console</text>
  <text class="lbl" x="792" y="608" text-anchor="middle" font-size="11" fill="#6B6259">company: own data</text>
  <text class="lbl" x="792" y="624" text-anchor="middle" font-size="11" fill="#6B6259">platform: every company</text>
</svg>
